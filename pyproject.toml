[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-stream-lab"
version = "0.1.0"
description = "A clean multi-camera, batched object-detection research runtime."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "numpy>=1.26,<3",
  "omegaconf>=2.3,<3",
  "onnxruntime>=1.18,<2",
  "opencv-python>=4.9,<5",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
# PyTorch publishes CPU and CUDA wheels on separate indexes. Keep both runtime
# variants on the same public Torch/Torchvision versions so CPU/GPU behavior is
# comparable. Use scripts/install_runtime.py; a bare `pip install .[gpu]` cannot
# discover the CUDA wheel without the PyTorch index.
cpu = [
  "torch==2.11.0+cpu",
  "torchvision==0.26.0+cpu",
  "ultralytics>=8.3,<9",
]
gpu = [
  "torch==2.11.0+cu128",
  "torchvision==0.26.0+cu128",
  "ultralytics>=8.3,<9",
]
triton = ["tritonclient[grpc]>=2.47,<3"]
export = ["onnx>=1.16,<2", "onnxslim>=0.1.82,<1", "ultralytics>=8.3,<9"]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
vision-stream-lab = "vision_stream_lab.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vision_stream_lab.monitoring" = ["frontend/*.html", "frontend/*.css", "frontend/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
