inference:
  $ref: inference/detection/yolo/yolo11n_pt.yaml
  # Road-camera profile overrides the reusable COCO model preset.
  confidence: 0.2
  # person, bicycle, car, motorcycle, bus, truck (COCO class IDs)
  classes: [0, 1, 2, 3, 5, 7]

tracker:
  enabled: false
  iou_threshold: 0.10
  max_missed: 0
  process_noise: 10.0
  measurement_noise: 2.0
  max_extrapolation_ms: 150
