# Plugin baseline only. Keep camera, site, and deployment-specific values in a
# profile under profiles/ that references this file.
inference:
  $ref: inference/detection/yolo/yolo11n_pt.yaml

tracker:
  enabled: false
  iou_threshold: 0.10
  max_missed: 0
  process_noise: 10.0
  measurement_noise: 2.0
  max_extrapolation_ms: 150

spatial:
  coordinate_space: normalized
  reference_size: null
  zones:
    enabled: false
    anchor: bottom_center
    cameras: {}
  rendering:
    show_zones: true
    zone_color: [0, 0, 255]  # OpenCV BGR
    zone_thickness: 2
