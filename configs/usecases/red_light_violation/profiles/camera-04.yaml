$ref: usecases/red_light_violation/default.yaml

inference:
  execution: shared
  confidence: 0.10
  # COCO motorcycle only.
  classes: [3]

tracker:
  frame_rate: 6.0
  lost_track_buffer: 90
  minimum_iou_threshold: 0.07

spatial:
  cameras:
    camera-04:
      roi:
        - [0.22, 0.25]
        - [0.88, 0.26]
        - [0.98, 0.99]
        - [0.14, 0.99]
      stop_line:
        - [0.16, 0.79]
        - [0.96, 0.82]
      # Vehicles must first be seen here, then leave this region across stop_line.
      approach_roi:
        - [0.16, 0.79]
        - [0.96, 0.82]
        - [0.98, 0.99]
        - [0.14, 0.99]

      # Opposite three-aspect signal, calibrated from the 1600x1200 source.
      traffic_light:
        roi:
          - [0.86, 0.38]
          - [0.89, 0.38]
          - [0.89, 0.48]
          - [0.86, 0.47]
        bulb_positions:
          red: [0.67, 0.20]
          yellow: [0.67, 0.50]
          green: [0.67, 0.80]
        bulb_radius: 0.25
        min_score: 0.20
        smoothing_window: 1

      exits:
        - id: straight
          movement: straight
          polygon:
            - [0.78, 0.45]
            - [0.75, 0.32]
            - [0.49, 0.32]
            - [0.43, 0.44]

        - id: left
          movement: left_turn
          polygon:
            - [0.23, 0.37]
            - [0.36, 0.37]
            - [0.29, 0.63]
            - [0.18, 0.63]

        - id: right
          movement: right_turn
          polygon:
            - [0.83, 0.58]
            - [0.79, 0.44]
            - [0.87, 0.43]
            - [0.91, 0.57]

      policy:
        enforced_light_states: [red]
        allowed:
          right_turn: [] # motorcycle
          straight: []
          left_turn: []

lifecycle:
  max_movement_seconds: 90
  stale_track_seconds: 6
