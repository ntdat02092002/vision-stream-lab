$ref: usecases/red_light_violation/default.yaml

inference:
  confidence: 0.10
  # COCO motorcycle only.
  classes: [3]

spatial:
  cameras:
    camera-01:
      roi:
        - [0.42, 0.43]
        - [0.81, 0.43]
        - [0.97, 0.99]
        - [0.34, 0.99]
      stop_line:
        - [0.37, 0.73]
        - [0.9, 0.73]
      confirmation_line:
        - [0.39, 0.61]
        - [0.86, 0.6]
      # Far side of the road -> near side of the camera is IN.
      crossing_direction: stop_to_confirmation
      exits:
        - id: straight
          movement: straight
          polygon:
            - [0.37, 0.73]
            - [0.9, 0.73]
            - [0.86, 0.6]
            - [0.39, 0.61]

        - id: left
          movement: left_turn
          polygon:
            - [0.37, 0.73]
            - [0.9, 0.73]
            - [0.86, 0.6]
            - [0.39, 0.61]

        - id: right
          movement: right_turn
          polygon:
            - [0.37, 0.73]
            - [0.9, 0.73]
            - [0.86, 0.6]
            - [0.39, 0.61]

      policy:
        enforced_light_states: [red]
        allowed:
          right_turn: [3] # motorcycle
          straight: []
          left_turn: []

lifecycle:
  max_transition_seconds: 90
  stale_track_seconds: 6
